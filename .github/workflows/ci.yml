name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pkgs:
    runs-on: macos-latest
    env:
      GOWORK: "off"
      GOFLAGS: "-trimpath"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod for stray replace directives
        run: |
          if grep -Eq '^[[:space:]]*replace\b' go.mod; then
            echo "Found replace directive in go.mod:" >&2
            grep -En '^[[:space:]]*replace\b' go.mod >&2
            exit 1
          fi

      - name: Check gofmt
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race (non-app packages)
        run: |
          pkgs="$(go list ./... | grep -v '^ofam\.dev/matomeru/app$')"
          go test -race $pkgs

  app:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A-E
            pattern: "^Test[A-E]"
          - name: F-O
            pattern: "^Test[F-O]"
          - name: P
            pattern: "^TestP"
          - name: Q-S
            pattern: "^Test[Q-S]"
          - name: T-Z
            pattern: "^Test([T-Z]|[^A-Z])"
    name: app (${{ matrix.name }})
    env:
      GOWORK: "off"
      GOFLAGS: "-trimpath"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race ./app (${{ matrix.name }})
        run: go test -race -timeout 15m -run "${{ matrix.pattern }}" ./app

  smoke:
    runs-on: macos-latest
    env:
      GOWORK: "off"
      GOFLAGS: "-trimpath"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build mtm
        run: go build -o /tmp/mtm ./cmd/mtm

      - name: Run isolated smoke and binding check
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/cfg" XDG_STATE_HOME="$tmp/state" XDG_DATA_HOME="$tmp/data" /tmp/mtm --smoke
          HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/cfg" XDG_STATE_HOME="$tmp/state" XDG_DATA_HOME="$tmp/data" /tmp/mtm binding check
